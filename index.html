<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suite Hub</title>
<meta name="theme-color" content="#2b348c">
<meta name="description" content="Launcher for the Selfie Social Society editor suite.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="hub-header">
  <img class="hub-logo" src="./icons/icon-192.png" alt="" width="48" height="48">
  <div>
    <h1>Suite Hub</h1>
    <p class="sub">Selfie Social Society editors</p>
  </div>
</header>

<main>
  <section aria-label="Editors">
    <h2>Editors</h2>
    <div id="launcher-grid" class="grid" role="list"></div>
  </section>

  <section aria-label="Shared assets">
    <h2>Shared Assets</h2>
    <p class="shelf-note">NPC cast, shared across editors</p>
    <div id="asset-shelf" class="shelf" role="list"></div>
    <p id="shelf-status" class="status" role="status"></p>
  </section>
</main>

<footer class="hub-footer">
  <p>Assets sync from the shared NPC manifest.</p>
</footer>

<script src="./app.js" defer></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
